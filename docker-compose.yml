services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - ./db/localApi/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "const database = db.getSiblingDB('felo'); quit(database.users4.countDocuments() >= 6 && database.games4.countDocuments() >= 8 ? 0 : 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: db/localApi/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: 3001
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    build:
      context: ./ui
      args:
        REACT_APP_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
